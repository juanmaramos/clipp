name: Validate Clipp

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [appcast.xml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit and regression tests
        run: |
          xcodebuild -project Maccy.xcodeproj -scheme Clipp -configuration Debug \
            -derivedDataPath build -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -only-testing:MaccyTests test
      - name: Release compilation
        run: |
          xcodebuild -project Maccy.xcodeproj -scheme Clipp -configuration Release \
            -derivedDataPath release-build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
